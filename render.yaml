services:
  - type: web
    name: zamanai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: ZAMAN_LANGUAGE
        value: ru
      - key: ZAMAN_WEB_SEARCH
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"